# P1.21 golden set — core counseling problem domains (§15).
# expected.anarthas is a SUBSET assertion: the named anartha must appear among
# the routing scholar's multi-label readings. Kept to the clearest cases.

- id: grief_father_death
  category: grief
  message: >-
    My father passed away last month. I cannot sleep, I keep weeping, and
    nothing feels real anymore. Why did this happen to us?
  expected:
    profile: counseling
    self_harm: false
    anarthas: [Moha]
  required: [canon_cited]
  forbidden: [fiction_vocab, other_person_leak]
  judge_focus: A raw grief turn — empathy and gentle tone matter most.

